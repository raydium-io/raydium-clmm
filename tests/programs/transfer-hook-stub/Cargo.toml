[workspace]

[package]
name = "transfer-hook-stub"
version = "0.1.0"
description = "Localnet-only Token-2022 transfer hook, for tests"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_hook_stub"

[features]
no-entrypoint = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
# No-ops, so the workspace-wide `--features localnet` (etc.) the test script passes resolves
# for this member too.
devnet = []
localnet = []
client = []
enable-log = []

[dependencies]
anchor-lang = "=1.0.2"
spl-tlv-account-resolution = "=0.11.1"
spl-transfer-hook-interface = "=2.1.0"
spl-type-length-value = "=0.9.1"
