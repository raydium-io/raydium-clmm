[package]
name = "raydium-clmm"
version = "0.1.0"
description = "Anchor client and source for Raydium concentrated liquidity AMM"
edition = "2021"
keywords = ["solana", "anchor", "raydium"]

[lib]
crate-type = ["cdylib", "lib"]
name = "raydium_clmm"
doctest = false

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
client = []
no-log-ix-name = []
enable-log = []
devnet = []
localnet = []
paramset = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

# Feature cfgs referenced by upstream macros (anchor #[program]/#[derive(Accounts)],
# solana entrypoint, uint's construct_uint!) but not declared as our own features.
# Declaring them here silences rustc check-cfg false positives without touching code.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "enable-power"))',
    'cfg(target_os, values("solana"))',
] }

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", features = ["metadata", "memo"] }
uint = { git = "https://github.com/raydium-io/parity-common", package = "uint" }
bytemuck = { version = "1.19.0", features = ["derive", "min_const_generics"] }
arrayref = { version = "0.3.6" }
solana-security-txt = "1.1.1"
# Transfer hook support: ExtraAccountMetaList parsing + add_extra_accounts_for_execute_cpi.
# Pinned: must match the TLV layout the on-chain token-2022 uses (spl-pod 0.7 / tlv 0.11).
spl-transfer-hook-interface = "=2.1.0"
spl-tlv-account-resolution = "=0.11.1"
spl-type-length-value = "=0.9.1"

[dev-dependencies]
quickcheck = "0.9"
proptest = "1.0"
rand = "0.8.5"
